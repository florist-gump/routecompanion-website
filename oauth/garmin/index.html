<!DOCTYPE html>
<html lang="en">
<head>
    <title>Redirecting...</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <script>
        // Get the query parameters (code, state, etc.)
        const query = window.location.search;

        // Construct the deep link URL
        const appUrl = "routecompanion://oauth/garmin" + query;

        // Redirect to the app
        window.location.href = appUrl;

        // Fallback message if the app doesn't open immediately
        setTimeout(function() {
            document.getElementById('message').innerText = "If the app doesn't open automatically, please tap the button below.";
            document.getElementById('retry-btn').style.display = 'inline-block';
        }, 1000);
    </script>
    <link rel="stylesheet" href="/assets/tokens.css">
    <style>
        body {
            font-family: var(--font-sans);
            text-align: center;
            padding-top: 50px;
            background-color: var(--bg-base);
            color: var(--text-primary);
        }
        /* `display: none` is the initial state the inline script flips to
           `inline-block` after a second. Do not change the display type here
           without changing that line too. */
        .btn {
            display: none;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: var(--primary);
            color: var(--text-on-primary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <p id="message">Redirecting to Route Companion...</p>
    <a id="retry-btn" class="btn" href="#" onclick="window.location.href = appUrl; return false;">Open App</a>
</body>
</html>
